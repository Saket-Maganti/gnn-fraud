# Tooling configuration for the GNN-fraud / RUNS evaluation-protocol project.
# (No build backend — this repo is run as scripts, not installed as a package.)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["gnn_env", "venv", ".venv", "gnnpaper", "runs_paper", "kaggle"]

[tool.ruff.lint]
# Critical "is it valid Python" rules only: syntax errors (E9), broken
# constructs (F63/F7) and undefined names (F82). Style is left to the author so
# CI stays green and meaningful across the legacy tree. Tighten locally as
# desired (e.g. add F401 for unused imports).
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = "(gnn_env|venv|\\.venv|gnnpaper|runs_paper|kaggle)/"
