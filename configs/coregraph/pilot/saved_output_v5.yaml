  best_fixed_criterion: mean_environment_balanced_validation_brier
  tie_break: frozen_expert_order
  logistic_c: [0.1, 1.0, 10.0]
abstention:
  capacity: 0.10
  cost: 0.20
  threshold_fit: source_validation_only
  all_unavailable: forced_abstention
review_fraction: 0.01
expert_relative_costs:
  feature_mlp: 1.0
  gcn: 3.0
  graphsage: 4.0
