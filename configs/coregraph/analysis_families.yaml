schema: coregraph_analysis_plan_v1
frozen_before_final_runs: true
primary_metric: worst_contract_auprc
secondary_metrics:
  - feasible_oracle_regret
  - cvar_0_2_auprc
  - recall_at_budget
  - brier
  - expected_compute
pairing_unit: dataset_task_contract_seed
aggregation_unit: seed_context
families:
  confirmatory_primary:
    hypotheses:
      - coregraph_vs_best_single_worst_contract
      - coregraph_vs_graphsafe_regret
      - coregraph_vs_no_contract_heldout_combination
    correction: holm
    alpha: 0.05
    test: paired_permutation
  confirmatory_calibration:
    hypotheses:
      - coregraph_vs_best_single_brier
      - coregraph_vs_best_single_adaptive_ece
    correction: holm
    alpha: 0.05
    test: paired_bootstrap
  exploratory_ablations:
    hypotheses:
      - all_preregistered_ablation_contrasts
    correction: benjamini_hochberg
    alpha: 0.05
    test: exact_wilcoxon_or_sign
missingness:
  resource_blocked: report_and_exclude_from_infeasible_oracle
  failed: report_no_imputation
  missing_seed: blocks_confirmatory_claim
