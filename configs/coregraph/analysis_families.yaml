schema: coregraph_analysis_plan_v2
frozen_before_final_runs: true
pairing_unit: seed_after_exact_dataset_task_target_contract_fold_pairing
contract_rows_as_independent_seeds: prohibited
primary_outcomes:
  - auprc
  - recall_at_0.5pct
  - recall_at_1pct
  - recall_at_2pct
  - budget_curve_area
  - mean_regret
  - maximum_regret
  - cvar_regret
  - selective_risk
  - compute
inference:
  - exact_wilcoxon
  - paired_permutation
  - seed_block_bootstrap
families:
  ranking_and_budget:
    outcomes:
      - auprc
      - recall_at_0.5pct
      - recall_at_1pct
      - recall_at_2pct
      - budget_curve_area
    comparisons: every_predeclared_strong_baseline
    correction: holm
    alpha: 0.05
  robust_risk:
    outcomes:
      - mean_regret
      - maximum_regret
      - cvar_regret
    comparisons: every_predeclared_strong_baseline
    correction: holm
    alpha: 0.05
  deployment:
    outcomes:
      - selective_risk
      - compute
    comparisons: every_predeclared_strong_baseline
    correction: holm
    alpha: 0.05
missingness:
  resource_blocked: report_and_exclude_from_predictive_ordering
  failed: report_no_imputation
  missing_seed: blocks_confirmatory_claim
